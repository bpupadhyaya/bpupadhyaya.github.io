<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6ecf8"/>
    </linearGradient>
    <linearGradient id="red" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ff7f8c"/><stop offset="0.45" stop-color="#cf2d41"/><stop offset="1" stop-color="#7a1327"/>
    </linearGradient>
    <linearGradient id="blue" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7fb4ff"/><stop offset="0.45" stop-color="#2f62d6"/><stop offset="1" stop-color="#112a72"/>
    </linearGradient>
    <linearGradient id="redx" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8e1a2d"/><stop offset="1" stop-color="#4a0b19"/></linearGradient>
    <linearGradient id="bluex" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17368d"/><stop offset="1" stop-color="#0a1a4d"/></linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#0b1b4a" flood-opacity="0.38"/>
    </filter>
    <filter id="tsh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0b1b4a" flood-opacity="0.35"/>
    </filter>
    <path id="leaf" d="M3 49 C-4 26 9 8 35 0 C40 21 27 40 3 49 Z"/>
    <path id="hl" d="M7 42 C3 25 13 11 31 4" fill="none" stroke="url(#gloss)" stroke-width="3" stroke-linecap="round"/>
  </defs>
  <rect x="5" y="4" width="110" height="110" rx="26" fill="url(#tile)" stroke="#c9d3ec" stroke-width="1.2" filter="url(#tsh)"/>
  <rect x="9" y="7" width="102" height="48" rx="22" fill="#fff" opacity="0.7"/>
  <g transform="translate(60 60) scale(0.86) translate(-61 -62)" filter="url(#sh)">
    <g transform="translate(52 64) scale(0.9 1.2)"><use href="#leaf" fill="url(#redx)" transform="translate(2.5 2.5)"/><use href="#leaf" fill="url(#red)"/><use href="#leaf" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="0.9" transform="translate(5.5 7) scale(0.8)"/><use href="#hl"/></g>
    <g transform="translate(28 36) scale(0.9 1.2)"><use href="#leaf" fill="url(#bluex)" transform="translate(2.5 2.5)"/><use href="#leaf" fill="url(#blue)"/><use href="#leaf" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="0.9" transform="translate(5.5 7) scale(0.8)"/><use href="#hl"/></g>
    <g transform="translate(50 8) scale(0.9 1.2)"><use href="#leaf" fill="url(#redx)" transform="translate(2.5 2.5)"/><use href="#leaf" fill="url(#red)"/><use href="#leaf" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="0.9" transform="translate(5.5 7) scale(0.8)"/><use href="#hl"/></g>
  </g>
</svg>
